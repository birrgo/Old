name: Convert PWA to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_title:
        description: 'Notification Title'
        required: true
        default: 'Fira Tech Updated!'
        type: string
      push_message:
        description: 'Notification Message'
        required: true
        default: 'A new version or item has been posted. Open the app to check it out!'
        type: string
      image_url:
        description: 'Image URL for Big Picture Popup (Optional)'
        required: false
        type: string

env:
  APP_NAME: "Fira Tech"
  PACKAGE_NAME: "com.firatech.app"
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Esbuild
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/splash-screen@8 capacitor-admob-nextgen@1.2.9 @onesignal/capacitor-plugin esbuild

      - name: Initialize AdMob SDK Variables
        run: |
          node -e "
          const fs = require('fs');
          let pkg = JSON.parse(fs.readFileSync('package.json'));
          pkg.admob = {
            androidAppId: '${{ env.ADMOB_APP_ID }}',
            enableNativeAds: { android: true } 
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Bundle Web Files & Compile Native Bridge
        run: |
          rm -rf www
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/
          
          echo "import { Capacitor } from '@capacitor/core';" > bridge.js
          echo "import { AdMobNextGen } from 'capacitor-admob-nextgen';" >> bridge.js
          echo "import OneSignalPlugin from '@onesignal/capacitor-plugin';" >> bridge.js
          echo "window.Capacitor = Capacitor;" >> bridge.js
          echo "window.AdMobPlugin = AdMobNextGen;" >> bridge.js
          echo "window.OneSignal = OneSignalPlugin.default || OneSignalPlugin;" >> bridge.js
          
          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          echo '{' > capacitor.config.json
          echo '  "appId": "${{ env.PACKAGE_NAME }}",' >> capacitor.config.json
          echo '  "appName": "${{ env.APP_NAME }}",' >> capacitor.config.json
          echo '  "webDir": "www",' >> capacitor.config.json
          echo '  "bundledWebRuntime": false,' >> capacitor.config.json
          echo '  "plugins": {' >> capacitor.config.json
          echo '    "SplashScreen": {' >> capacitor.config.json
          echo '      "launchShowDuration": 3000,' >> capacitor.config.json
          echo '      "launchAutoHide": true,' >> capacitor.config.json
          echo '      "backgroundColor": "#001a66",' >> capacitor.config.json
          echo '      "androidSplashResourceName": "splash",' >> capacitor.config.json
          echo '      "androidScaleType": "CENTER_CROP",' >> capacitor.config.json
          echo '      "splashFullScreen": true,' >> capacitor.config.json
          echo '      "splashImmersive": true,' >> capacitor.config.json
          echo '      "showSpinner": false' >> capacitor.config.json
          echo '    }' >> capacitor.config.json
          echo '  }' >> capacitor.config.json
          echo '}' >> capacitor.config.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js; fi
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-native.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-native.js; fi
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Set Custom App and Notification Icons
        run: |
          # 1. Set OneSignal Notification Icons (s2.png)
          mkdir -p android/app/src/main/res/drawable
          cp s2.png android/app/src/main/res/drawable/ic_stat_onesignal_default.png
          cp s2.png android/app/src/main/res/drawable/ic_onesignal_large_icon_default.png
          
          # 2. Set Main App Icons (s.png) across all Android resolution folders
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp s.png android/app/src/main/res/$dir/ic_launcher.png
            cp s.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp s.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

      - name: Target Android SDK 36
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle

      - name: Set Dynamic Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Add Google Services JSON
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      # ============================================================
      # OVERLAY POPUP SETUP — everything generated inline, no extra
      # files need to be committed to your repo.
      # ============================================================

      - name: Add Overlay Permission & Service Declaration to Manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' "$MANIFEST"
          sed -i '/<\/application>/i \    <meta-data android:name="com.onesignal.NotificationServiceExtension" android:value="com.firatech.app.MyNotificationHandler" />' "$MANIFEST"
          sed -i '/<\/application>/i \    <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="specialUse" />' "$MANIFEST"

      - name: Add Picasso Dependency
        run: |
          sed -i "/dependencies {/a\\    implementation 'com.squareup.picasso:picasso:2.71828'" android/app/build.gradle

      - name: Generate Overlay Java Classes
        run: |
          PKG_DIR="android/app/src/main/java/com/firatech/app"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.firatech.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  checkOverlayPermission();
              }

              private void checkOverlayPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivity(intent);
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/OverlayService.java"
          package com.firatech.app;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.TextView;
          import androidx.annotation.Nullable;
          import com.squareup.picasso.Picasso;

          public class OverlayService extends Service {
              private WindowManager windowManager;
              private View overlayView;

              @Override
              public void onCreate() {
                  super.onCreate();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  String title = intent.getStringExtra("custom_title");
                  String message = intent.getStringExtra("custom_message");
                  String imageUrl = intent.getStringExtra("custom_image");

                  showOverlay(title, message, imageUrl);
                  return START_NOT_STICKY;
              }

              private void showOverlay(String title, String message, String imageUrl) {
                  LayoutInflater inflater = LayoutInflater.from(this);
                  overlayView = inflater.inflate(R.layout.overlay_popup, null);

                  TextView titleView = overlayView.findViewById(R.id.overlay_title);
                  TextView msgView = overlayView.findViewById(R.id.overlay_message);
                  ImageView imgView = overlayView.findViewById(R.id.overlay_image);
                  Button closeBtn = overlayView.findViewById(R.id.overlay_close);

                  titleView.setText(title);
                  msgView.setText(message);

                  if (imageUrl != null && !imageUrl.isEmpty()) {
                      Picasso.get().load(imageUrl).into(imgView);
                  } else {
                      imgView.setVisibility(View.GONE);
                  }

                  int overlayType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.CENTER;

                  closeBtn.setOnClickListener(v -> {
                      windowManager.removeView(overlayView);
                      stopSelf();
                  });

                  windowManager.addView(overlayView, params);
              }

              @Nullable
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (overlayView != null) {
                      windowManager.removeView(overlayView);
                  }
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MyNotificationHandler.java"
          package com.firatech.app;

          import android.content.Intent;
          import com.onesignal.notifications.INotificationReceivedEvent;
          import com.onesignal.notifications.INotificationServiceExtension;
          import org.json.JSONObject;

          public class MyNotificationHandler implements INotificationServiceExtension {
              @Override
              public void onNotificationReceived(INotificationReceivedEvent event) {
                  JSONObject data = event.getNotification().getAdditionalData();
                  if (data != null && "trigger_overlay_popup".equals(data.optString("action"))) {
                      event.preventDefault();

                      Intent overlayIntent = new Intent(
                          event.getContext(), OverlayService.class
                      );
                      overlayIntent.putExtra("custom_title", data.optString("custom_title"));
                      overlayIntent.putExtra("custom_message", data.optString("custom_message"));
                      overlayIntent.putExtra("custom_image", data.optString("custom_image"));
                      event.getContext().startService(overlayIntent);
                  }
              }
          }
          EOF

      - name: Generate Overlay Layout XML
        run: |
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/overlay_popup.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="#DD001a66"
              android:padding="20dp"
              android:elevation="10dp">

              <ImageView
                  android:id="@+id/overlay_image"
                  android:layout_width="match_parent"
                  android:layout_height="180dp"
                  android:scaleType="centerCrop"
                  android:layout_marginBottom="12dp"/>

              <TextView
                  android:id="@+id/overlay_title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"
                  android:textSize="18sp"/>

              <TextView
                  android:id="@+id/overlay_message"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#CCCCCC"
                  android:textSize="14sp"
                  android:layout_marginTop="6dp"
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/overlay_close"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="end"
                  android:text="Close"/>
          </LinearLayout>
          EOF

      # ============================================================
      # END OVERLAY POPUP SETUP
      # ============================================================

      - name: Build Installable Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Move & Rename APK Output
        run: mv android/app/build/outputs/apk/debug/app-debug.apk fira-tech.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk

      - name: Send OneSignal Push Notification (Background Data)
        run: |
          TITLE="${{ github.event.inputs.push_title || env.APP_NAME }}"
          MESSAGE="${{ github.event.inputs.push_message || 'A new version or item has been posted. Open the app to check it out!' }}"
          IMAGE_URL="${{ github.event.inputs.image_url || '' }}"
          
          # This sends a silent data payload to wake up the app in the background
          # so the OverlayService can draw the popup overlay.
          PAYLOAD=$(cat <<EOF
          {
            "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
            "included_segments": ["Subscribed Users"],
            "data": {
              "custom_title": "$TITLE",
              "custom_message": "$MESSAGE",
              "custom_image": "$IMAGE_URL",
              "action": "trigger_overlay_popup"
            },
            "content_available": true,
            "priority": 10,
            "android_channel_id": "2c87aaaf-d24f-4855-a992-3d749a5a016f"
          }
          EOF
          )

          curl --request POST \
            --url https://onesignal.com/api/v1/notifications \
            --header "Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"
