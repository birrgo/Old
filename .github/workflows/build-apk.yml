name: Convert PWA to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "Fira Tech"
  PACKAGE_NAME: "com.firatech.app"
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Esbuild
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/splash-screen@8 capacitor-admob-nextgen@1.2.9 @onesignal/capacitor-plugin esbuild

      - name: Bundle Web Files & Compile Native Bridge
        run: |
          rm -rf www
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' ./ www/
          
          echo "import { Capacitor } from '@capacitor/core';" > bridge.js
          echo "import { AdMobNextGen } from 'capacitor-admob-nextgen';" >> bridge.js
          echo "import OneSignalPlugin from '@onesignal/capacitor-plugin';" >> bridge.js
          echo "window.Capacitor = Capacitor;" >> bridge.js
          echo "window.AdMobPlugin = AdMobNextGen;" >> bridge.js
          echo "window.OneSignal = OneSignalPlugin.default || OneSignalPlugin;" >> bridge.js
          
          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "${{ env.PACKAGE_NAME }}",
            "appName": "${{ env.APP_NAME }}",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true,
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject OneSignal Gradle Dependency & Manifest Meta-Data
        run: |
          # 1. Add OneSignal SDK dependency to app build.gradle for custom Java Extender compilation
          sed -i '/dependencies {/a \    implementation "com.onesignal:OneSignal:[5.0.0, 5.99.99]"' android/app/build.gradle

          # 2. Inject POST_NOTIFICATIONS permission before <application>
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application|g' android/app/src/main/AndroidManifest.xml

          # 3. Inject OneSignal Extender and AdMob App ID inside <application>
          sed -i 's|</application>|        <meta-data android:name="com.onesignal.NotificationServiceExtension" android:value="com.firatech.app.NotificationExtender" />\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="${{ env.ADMOB_APP_ID }}" />\n    </application>|g' android/app/src/main/AndroidManifest.xml

      - name: Inject Custom Notification Layout & Logic
        run: |
          # Create the Pinterest-style XML Grid Layout
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/custom_heads_up.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="128dp"
              android:orientation="horizontal"
              android:background="#000000">
              <ImageView
                  android:id="@+id/img_left"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1.5"
                  android:scaleType="centerCrop"
                  android:layout_marginEnd="2dp"/>
              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:orientation="vertical">
                  <ImageView
                      android:id="@+id/img_top_right"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:scaleType="centerCrop"
                      android:layout_marginBottom="2dp"/>
                  <ImageView
                      android:id="@+id/img_bottom_right"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:scaleType="centerCrop" />
              </LinearLayout>
          </LinearLayout>
          EOF
          
          # Create the Java Extender using IDisplayableNotification
          mkdir -p android/app/src/main/java/com/firatech/app
          cat << 'EOF' > android/app/src/main/java/com/firatech/app/NotificationExtender.java
          package com.firatech.app;
          
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.widget.RemoteViews;
          import com.onesignal.notifications.INotificationServiceExtension;
          import com.onesignal.notifications.INotificationReceivedEvent;
          import com.onesignal.notifications.IDisplayableNotification;
          import org.json.JSONObject;
          import java.net.URL;
          import java.io.InputStream;
          
          public class NotificationExtender implements INotificationServiceExtension {
              
              private Bitmap downloadImage(String urlString) {
                  try {
                      InputStream in = new URL(urlString).openStream();
                      return BitmapFactory.decodeStream(in);
                  } catch (Exception e) {
                      return null;
                  }
              }

              @Override
              public void onNotificationReceived(INotificationReceivedEvent event) {
                  IDisplayableNotification notification = event.getNotification();
                  Context context = event.getContext();
                  
                  RemoteViews customView = new RemoteViews(context.getPackageName(), R.layout.custom_heads_up);
                  
                  try {
                      JSONObject data = notification.getAdditionalData();
                      if (data != null) {
                          Bitmap bmpLeft = downloadImage(data.optString("grid_1"));
                          if (bmpLeft != null) customView.setImageViewBitmap(R.id.img_left, bmpLeft);
                          
                          Bitmap bmpTopRight = downloadImage(data.optString("grid_2"));
                          if (bmpTopRight != null) customView.setImageViewBitmap(R.id.img_top_right, bmpTopRight);
                          
                          Bitmap bmpBottomRight = downloadImage(data.optString("grid_3"));
                          if (bmpBottomRight != null) customView.setImageViewBitmap(R.id.img_bottom_right, bmpBottomRight);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  
                  notification.setExtender(builder -> {
                      builder.setCustomHeadsUpContentView(customView);
                      return builder;
                  });
              }
          }
          EOF

      - name: Set Custom App and Notification Icons
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp s2.png android/app/src/main/res/drawable/ic_stat_onesignal_default.png
          cp s2.png android/app/src/main/res/drawable/ic_onesignal_large_icon_default.png
          
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp s.png android/app/src/main/res/$dir/ic_launcher.png
            cp s.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp s.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

      - name: Target Android SDK 36
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle

      - name: Set Dynamic Version Code
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle

      - name: Add Google Services JSON
        run: |
          cat << 'EOF' > android/app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build Installable Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Move & Rename APK Output
        run: mv android/app/build/outputs/apk/debug/app-debug.apk fira-tech.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk

      - name: Send OneSignal Push Notification
        run: |
          curl --request POST \
            --url https://onesignal.com/api/v1/notifications \
            --header "Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{
              "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
              "included_segments": ["Subscribed Users"],
              "headings": {"en": "${{ env.APP_NAME }} Updated!"},
              "contents": {"en": "Check out the new layout!"},
              "android_channel_id": "2c87aaaf-d24f-4855-a992-3d749a5a016f",
              "data": {
                 "grid_1": "https://hulum.online/push.png",
                 "grid_2": "https://hulum.online/push_2.png",
                 "grid_3": "https://hulum.online/push_3.png"
              }
            }'
