name: Convert PWA to Android APK

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      push_title:
        description: "Notification Title"
        required: true
        default: "Netsa Tips 🔔"
        type: string

      push_message:
        description: "Notification Message"
        required: true
        default: "🔥 Google Veo Explained! The Future of AI Filmmaking"
        type: string

env:
  APP_NAME: "Fira Tech"
  PACKAGE_NAME: "com.firatech.app"
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"
  NOTIFICATION_IMAGE: "https://hulum.online/push.png"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/splash-screen@8 \
            capacitor-admob-nextgen@1.2.9 \
            @onesignal/capacitor-plugin \
            esbuild

      - name: Configure AdMob
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json"));
          pkg.admob = {
            androidAppId: process.env.ADMOB_APP_ID,
            enableNativeAds: { android: true }
          };
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          NODE
        env:
          ADMOB_APP_ID: ${{ env.ADMOB_APP_ID }}

      - name: Prepare Website
        run: |
          rm -rf www
          mkdir www

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="www" \
            --exclude="node_modules" \
            ./ www/

      - name: Create Native Bridge
        run: |
          cat > bridge.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { AdMobNextGen } from 'capacitor-admob-nextgen';
          import OneSignalPlugin from '@onesignal/capacitor-plugin';

          window.Capacitor = Capacitor;
          window.AdMobPlugin = AdMobNextGen;
          window.OneSignal = OneSignalPlugin.default || OneSignalPlugin;
          EOF

          npx esbuild bridge.js --bundle --minify \
            --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${PACKAGE_NAME}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true,
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Create Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure AdMob Native
        run: |
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js ]; then
            node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js
          fi

          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-native.js ]; then
            node node_modules/capacitor-admob-nextgen/scripts/admob-native.js
          fi

      - name: Configure Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i '/<application/i \
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

          sed -i '/<application/i \
          <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

      - name: Set Icons
        run: |
          mkdir -p android/app/src/main/res/drawable

          cp s2.png android/app/src/main/res/drawable/ic_stat_onesignal_default.png
          cp s2.png android/app/src/main/res/drawable/ic_onesignal_large_icon_default.png

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            cp s.png android/app/src/main/res/$dir/ic_launcher.png
            cp s.png android/app/src/main/res/$dir/ic_launcher_round.png
            cp s.png android/app/src/main/res/$dir/ic_launcher_foreground.png
          done

      - name: Configure Android SDK
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi

      - name: Set Version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" \
            android/app/build.gradle

          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" \
            android/app/build.gradle

      - name: Add Firebase
        run: |
          cat > android/app/google-services.json <<'EOF'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      # =========================================================
      # CUSTOM WIDE NOTIFICATION
      # =========================================================

      - name: Create Notification Layout
        run: |
          mkdir -p android/app/src/main/res/layout

          cat > android/app/src/main/res/layout/notification_pinterest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ImageView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/notification_image"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:adjustViewBounds="true"
              android:scaleType="fitCenter"
              android:contentDescription="@null" />
          EOF

      - name: Create Notification Service
        run: |
          mkdir -p android/app/src/main/java/com/firatech/app

          cat > android/app/src/main/java/com/firatech/app/NotificationServiceExtension.java <<'EOF'
          package com.firatech.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.os.Build;
          import android.widget.RemoteViews;

          import androidx.annotation.Keep;
          import androidx.core.app.NotificationCompat;

          import com.onesignal.notifications.INotificationReceivedEvent;
          import com.onesignal.notifications.INotificationServiceExtension;

          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @Keep
          public class NotificationServiceExtension
                  implements INotificationServiceExtension {

              private static final String CHANNEL_ID =
                      "netsa_tips_notifications";

              private static final String IMAGE_URL =
                      "https://hulum.online/push.png";

              @Override
              public void onNotificationReceived(
                      INotificationReceivedEvent event) {

                  try {
                      Context context = event.getContext();

                      String title =
                              event.getNotification().getTitle();

                      String body =
                              event.getNotification().getBody();

                      event.preventDefault();

                      Bitmap image = downloadImage(IMAGE_URL);

                      createChannel(context);

                      RemoteViews views =
                              new RemoteViews(
                                  context.getPackageName(),
                                  R.layout.notification_pinterest
                              );

                      if (image != null) {
                          views.setImageViewBitmap(
                              R.id.notification_image,
                              image
                          );
                      }

                      Intent intent =
                              context.getPackageManager()
                                  .getLaunchIntentForPackage(
                                      context.getPackageName()
                                  );

                      PendingIntent pendingIntent =
                              PendingIntent.getActivity(
                                  context,
                                  1001,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                  PendingIntent.FLAG_IMMUTABLE
                              );

                      NotificationCompat.Builder notification =
                              new NotificationCompat.Builder(
                                  context,
                                  CHANNEL_ID
                              )
                              .setSmallIcon(
                                  R.drawable.ic_stat_onesignal_default
                              )
                              .setContentTitle(title)
                              .setContentText(body)
                              .setCustomContentView(views)
                              .setCustomBigContentView(views)
                              .setCustomHeadsUpContentView(views)
                              .setContentIntent(pendingIntent)
                              .setAutoCancel(true)
                              .setPriority(
                                  NotificationCompat.PRIORITY_MAX
                              )
                              .setCategory(
                                  NotificationCompat.CATEGORY_MESSAGE
                              )
                              .setVisibility(
                                  NotificationCompat.VISIBILITY_PUBLIC
                              );

                      NotificationManager manager =
                              (NotificationManager)
                              context.getSystemService(
                                  Context.NOTIFICATION_SERVICE
                              );

                      manager.notify(
                          (int) System.currentTimeMillis(),
                          notification.build()
                      );

                  } catch (Exception e) {
                      e.printStackTrace();

                      try {
                          event.getNotification().display();
                      } catch (Exception ignored) {}
                  }
              }

              private void createChannel(Context context) {

                  if (Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.O) {

                      NotificationManager manager =
                              (NotificationManager)
                              context.getSystemService(
                                  Context.NOTIFICATION_SERVICE
                              );

                      NotificationChannel channel =
                              new NotificationChannel(
                                  CHANNEL_ID,
                                  "Netsa Tips",
                                  NotificationManager.IMPORTANCE_HIGH
                              );

                      channel.enableVibration(true);

                      manager.createNotificationChannel(channel);
                  }
              }

              private Bitmap downloadImage(String urlString) {

                  HttpURLConnection connection = null;

                  try {
                      URL url = new URL(urlString);

                      connection =
                              (HttpURLConnection)
                              url.openConnection();

                      connection.setConnectTimeout(10000);
                      connection.setReadTimeout(15000);
                      connection.setDoInput(true);
                      connection.connect();

                      InputStream input =
                              connection.getInputStream();

                      return BitmapFactory.decodeStream(input);

                  } catch (Exception e) {
                      e.printStackTrace();
                      return null;

                  } finally {
                      if (connection != null) {
                          connection.disconnect();
                      }
                  }
              }
          }
          EOF

      - name: Register Notification Service
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Fixed sed command: Looks for the closing tag to safely insert metadata
          sed -i 's|</application>|<meta-data android:name="com.onesignal.NotificationServiceExtension" android:value="com.firatech.app.NotificationServiceExtension" /></application>|' "$MANIFEST"

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
            fira-tech.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk

      # =========================================================
      # PUSH
      # =========================================================

      - name: Send OneSignal Push
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TITLE: ${{ github.event.inputs.push_title }}
          MESSAGE: ${{ github.event.inputs.push_message }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          jq -n \
            --arg app "$ONESIGNAL_APP_ID" \
            --arg title "$TITLE" \
            --arg message "$MESSAGE" \
            '{
              app_id: $app,
              target_channel: "push",
              included_segments: ["Subscribed Users"],
              headings: {en: $title},
              contents: {en: $message},
              priority: 10
            }' > payload.json

          curl --fail-with-body \
            --request POST \
            --url "https://api.onesignal.com/notifications" \
            --header "Authorization: Key ${ONESIGNAL_API_KEY}" \
            --header "Content-Type: application/json" \
            --data @payload.json
