name: Convert PWA to Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "Fira Tech"
  PACKAGE_NAME: "com.firatech.app"
  ADMOB_APP_ID: "ca-app-pub-3940256099942544~3347511713"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ ! -f package.json ]; then npm init -y; fi
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/splash-screen@8 capacitor-admob-nextgen@1.2.9 esbuild

      - name: Configure AdMob
        run: |
          node -e "
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json'));
          p.admob={
            androidAppId:'${{ env.ADMOB_APP_ID }}',
            enableNativeAds:{android:true}
          };
          fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          "

      - name: Prepare Web App
        run: |
          rm -rf www
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='node_modules' --exclude='android' --exclude='package-lock.json' ./ www/
          printf "import { Capacitor } from '@capacitor/core';\nimport { AdMobNextGen } from 'capacitor-admob-nextgen';\nwindow.Capacitor=Capacitor;\nwindow.AdMobPlugin=AdMobNextGen;\n" > bridge.js
          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.firatech.app",
            "appName": "Fira Tech",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true,
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create Android Project
        run: |
          npx cap add android
          npx cap sync android
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-manifest.js; fi
          if [ -f node_modules/capacitor-admob-nextgen/scripts/admob-native.js ]; then node node_modules/capacitor-admob-nextgen/scripts/admob-native.js; fi

      - name: Configure Android SDK
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 24/' android/app/build.gradle
            sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Set Version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk fira-tech.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fira-tech-apk
          path: fira-tech.apk
